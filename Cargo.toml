[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Justy Null"]
repository = "https://github.com/Lustyn/scribblekit"
homepage = "https://github.com/Lustyn/scribblekit"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
flate2 = "1"
scribble-core = { path = "crates/scribble-core" }
scribble-pack = { path = "crates/scribble-pack" }
scribble-formats = { path = "crates/scribble-formats" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
