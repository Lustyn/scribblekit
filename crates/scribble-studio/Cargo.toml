[package]
name = "scribble-studio"
description = "Object viewer/editor and dictionary editor for Scribblenauts Unlimited"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
scribble-core.workspace = true
scribble-pack.workspace = true
scribble-formats.workspace = true
fmt-vec = { path = "../fmt-vec" }
fmt-anim = { path = "../fmt-anim" }
fmt-dictionary = { path = "../fmt-dictionary" }
fmt-object = { path = "../fmt-object" }
eframe = "0.36.2"
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
rfd = "0.17.2"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["snapshot", "wgpu", "eframe"] }
